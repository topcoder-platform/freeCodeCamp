name: Security dependency audit
on:
  pull_request:
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    env:
      CYPRESS_INSTALL_BINARY: '0'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GATSBY_TELEMETRY_DISABLED: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - run: npm audit --audit-level=moderate
      - run: npm run test:frontend-compat
      - run: node --test tools/minimatch-compat/index.test.cjs
